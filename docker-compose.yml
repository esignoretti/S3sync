services:
  s3sync:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - s3sync-config:/home/nonroot/.s3sync
    environment:
      # Required. An empty value silently stores bucket credentials in
      # plaintext with only a log warning; fail fast instead.
      - BUCKETSYNC_MASTER_KEY=${BUCKETSYNC_MASTER_KEY:?BUCKETSYNC_MASTER_KEY is required}
    restart: unless-stopped

volumes:
  s3sync-config:
